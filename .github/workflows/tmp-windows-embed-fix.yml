name: Temporary Windows embed path fix
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'i18n/split-translations-by-language'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: i18n/split-translations-by-language
          fetch-depth: 0
      - name: Patch slash paths
        run: |
          sed -i '/"path\/filepath"/i\	"path"' chicha-isotope-map.go
          sed -i 's/filepath.Ext(entry.Name())/path.Ext(entry.Name())/g' chicha-isotope-map.go
          sed -i 's/filepath.Join(dirname, entry.Name())/path.Join(dirname, entry.Name())/g' chicha-isotope-map.go
          sed -i 's/"path\/filepath"/"path"/' chicha-isotope-map_test.go
          sed -i 's/filepath.Ext(entry.Name())/path.Ext(entry.Name())/g' chicha-isotope-map_test.go
          sed -i 's/filepath.Join("public_html\/translations", entry.Name())/path.Join("public_html\/translations", entry.Name())/g' chicha-isotope-map_test.go
          gofmt -w chicha-isotope-map.go chicha-isotope-map_test.go
      - name: Test
        run: go test ./...
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add chicha-isotope-map.go chicha-isotope-map_test.go
          git commit -m 'Use slash paths for embedded translations'
          git push
