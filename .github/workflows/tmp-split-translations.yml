name: Temporary split translations

on:
  pull_request:
  push:
    branches:
      - i18n/split-translations-by-language

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: i18n/split-translations-by-language
      - name: Split translation dictionary
        run: python3 .tmp-split-translations.py
      - name: Format and test
        run: |
          gofmt -w chicha-isotope-map.go chicha-isotope-map_test.go
          go test ./...
      - name: Commit final migration without temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-split-translations.yml .tmp-split-translations.py
          git add -A
          git commit -m "Split translations into per-language files"
          git push origin HEAD:i18n/split-translations-by-language
